# Пример конфигурации nginx для restkarelia.ru. Корень сайта — содержимое папки dist/
# после `npm run build`. Пути к сертификатам подставьте свои (например, от Let's Encrypt).

server {
    listen 80;
    listen [::]:80;
    server_name restkarelia.ru www.restkarelia.ru;
    return 301 https://restkarelia.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.restkarelia.ru;
    ssl_certificate     /etc/letsencrypt/live/restkarelia.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restkarelia.ru/privkey.pem;
    return 301 https://restkarelia.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name restkarelia.ru;
    ssl_certificate     /etc/letsencrypt/live/restkarelia.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restkarelia.ru/privkey.pem;

    root /var/www/restkarelia.ru;
    index index.html;
    charset utf-8;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/xml image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; frame-src https://yandex.ru https://*.yandex.ru; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # /index.html и /раздел/index.html — на адрес со слэшем.
    location ~ ^(.*/)index\.html$ { return 301 $1; }

    # /раздел без слэша — nginx сам отправит на /раздел/ (301).
    location / { try_files $uri $uri/ =404; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ~* \.(webp|jpg|png|svg|ico|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ~ /\.(?!well-known) { deny all; }
}
